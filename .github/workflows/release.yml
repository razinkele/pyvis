name: Release

# Tag pushes release automatically. workflow_dispatch re-runs a release for an
# existing tag without minting a new version, so fixing a CI fault does not
# cost a version number.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v4.3.1"
        required: true
        type: string

env:
  RELEASE_REF: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,shiny,test]"
      - name: Tag must match pyvis/_version.py
        run: |
          TAG="${RELEASE_REF#v}"
          CODE=$(python -c "import pyvis._version as v; print(v.__version__)")
          test "$TAG" = "$CODE" || { echo "tag v$TAG != code $CODE"; exit 1; }
      - run: python validate_version.py
      - run: python -m pytest pyvis/tests/ --ignore=pyvis/tests/test_html.py --ignore=pyvis/tests/test_bindings_js.py -v

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine && python -m build
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$PYPI_API_TOKEN" || { echo "PYPI_API_TOKEN secret is not set"; exit 1; }
          # --skip-existing so a re-run after a partial failure is not fatal.
          twine upload --skip-existing dist/* -u __token__ -p "$PYPI_API_TOKEN"

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        run: echo "version=${RELEASE_REF#v}" >> "$GITHUB_OUTPUT"
      - id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -n "/## \[$VERSION\]/,/^## \[/{ /^## \[$VERSION\]/p; /^## \[/!p; }" CHANGELOG.md > release_notes.md
          test -s release_notes.md || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }
          { echo "body<<EOF"; cat release_notes.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false

  conda:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # conda-forge is pinned explicitly: the runner's implicit `defaults`
      # channel does not carry every host dependency the recipe needs (the
      # build failed resolving `pip` without this).
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          conda-remove-defaults: "true"
      - run: python validate_version.py
      # conda 26 dispatches `conda build` through a plugin that is not always
      # registered in the same session it is installed in, so invoke the
      # `conda-build` entry point directly: it ships with the conda-build
      # package and does not depend on that plugin lookup.
      - run: conda install -y -c conda-forge conda-build anaconda-client
      - run: conda-build --no-anaconda-upload -c conda-forge conda.recipe/
      - name: Upload to Anaconda
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          test -n "$ANACONDA_TOKEN" || { echo "ANACONDA_TOKEN secret is not set"; exit 1; }
          PKG="$(conda-build conda.recipe/ -c conda-forge --output)"
          test -f "$PKG" || { echo "built package not found at: $PKG"; exit 1; }
          # --force so re-running a failed release can overwrite a partial upload.
          anaconda -t "$ANACONDA_TOKEN" upload --force --user razinka "$PKG"
