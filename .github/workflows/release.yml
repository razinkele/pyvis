name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,shiny,test]"
      - name: Tag must match pyvis/_version.py
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CODE=$(python -c "import pyvis._version as v; print(v.__version__)")
          test "$TAG" = "$CODE" || { echo "tag v$TAG != code $CODE"; exit 1; }
      - run: python validate_version.py
      - run: python -m pytest pyvis/tests/ --ignore=pyvis/tests/test_html.py --ignore=pyvis/tests/test_bindings_js.py -v

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine && python -m build
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$PYPI_API_TOKEN" || { echo "PYPI_API_TOKEN secret is not set"; exit 1; }
          twine upload dist/* -u __token__ -p "$PYPI_API_TOKEN"

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -n "/## \[$VERSION\]/,/^## \[/{ /^## \[$VERSION\]/p; /^## \[/!p; }" CHANGELOG.md > release_notes.md
          test -s release_notes.md || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }
          { echo "body<<EOF"; cat release_notes.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false

  conda:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
      - run: python validate_version.py
      # conda 26 dispatches `conda build` through a plugin that is not always
      # registered in the same session it is installed in, so invoke the
      # `conda-build` entry point directly: it is installed by the conda-build
      # package itself and does not depend on that plugin lookup.
      - run: conda install -y -c conda-forge conda-build anaconda-client
      - run: conda-build --no-anaconda-upload conda.recipe/
      - name: Upload to Anaconda
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          test -n "$ANACONDA_TOKEN" || { echo "ANACONDA_TOKEN secret is not set"; exit 1; }
          PKG="$(conda-build conda.recipe/ --output)"
          test -f "$PKG" || { echo "built package not found at: $PKG"; exit 1; }
          anaconda -t "$ANACONDA_TOKEN" upload --user razinka "$PKG"
